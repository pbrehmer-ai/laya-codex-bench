name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run offline unit tests
        shell: pwsh
        run: |
          python -m compileall -q laya_codex_bench laya_local.py
          python -m unittest discover -s tests -v
