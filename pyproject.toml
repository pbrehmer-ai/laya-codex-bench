[project]
name = "laya-local-decision-model-test"
version = "0.1.0"
description = "Reproducible benchmarks for Laya-assisted Codex decision workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4,<5",
    "laya==0.3.4",
    "mcp>=1,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
include = ["laya_codex_bench", "tests"]
